name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Nightly at 3 AM UTC
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1 — Lint, typecheck, test, quality gates
  # Runs on every PR and push. Target: < 90 seconds.
  # ──────────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history for `git diff` against base branch
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # --- Static analysis (parallel-safe, order doesn't matter) ---
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm spell
      - run: pnpm typecheck

      # --- Tests ---
      # PR: run only tests related to changed files for speed.
      # Push / schedule: run the full suite.
      - name: Test (related files only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only origin/"$BASE_REF"...HEAD -- '*.ts' '*.mts' '*.mjs' '*.js' || true)
          if [ -z "$CHANGED" ]; then
            echo "No source files changed — skipping vitest."
          else
            echo "$CHANGED" | xargs npx vitest run --related
          fi

      - name: Test (full suite)
        if: github.event_name != 'pull_request'
        run: pnpm test

      # --- Quality gates ---
      - run: pnpm knip
      - run: pnpm dep-check
      - run: pnpm quality:verify:strict

      # --- Upload build artifact for downstream jobs ---
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────
  # Job 2 — Validate example specs (schema-only, no capture)
  # Runs on every PR and push. ~3 seconds.
  # ──────────────────────────────────────────────────────────────────
  validate-specs:
    name: Validate Specs
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - run: pnpm examples:validate -- --no-build

  # ──────────────────────────────────────────────────────────────────
  # Job 3 — Capture PR-tier specs (PR only, sharded)
  # Only runs when playback/editor/capture/quality/narration/spec/examples change.
  # ──────────────────────────────────────────────────────────────────
  pr-tier-matrix:
    name: PR Capture Matrix
    if: github.event_name == 'pull_request'
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            capture:
              - 'src/playback/**'
              - 'src/editor/**'
              - 'src/capture/**'
              - 'src/quality/**'
              - 'src/narration/**'
              - 'src/spec/**'
              - 'src/cli/**'
              - 'src/validation/**'
              - 'examples/**'
      - name: Generate matrix
        id: gen
        if: steps.changes.outputs.capture == 'true'
        run: |
          MATRIX=$(node scripts/ci-matrix.mjs --tier pr)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  capture-pr-tier:
    name: "Capture: ${{ matrix.slug }}"
    if: github.event_name == 'pull_request' && needs.pr-tier-matrix.outputs.matrix != ''
    needs: [lint-and-test, pr-tier-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.pr-tier-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      # Cache Playwright browsers
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e 'console.log(require("./node_modules/playwright/package.json").version)')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-ubuntu

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # --- Flake quarantine check ---
      - name: Check quarantine status
        id: quarantine
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          node scripts/flake-quarantine.mjs --check "$SLUG" && echo "quarantined=false" >> "$GITHUB_OUTPUT" || {
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 78 ]; then
              echo "::warning::${SLUG} is quarantined — failures will be treated as warnings"
              echo "quarantined=true" >> "$GITHUB_OUTPUT"
            else
              echo "quarantined=false" >> "$GITHUB_OUTPUT"
              exit "$EXIT_CODE"
            fi
          }

      - name: Capture
        id: capture
        continue-on-error: ${{ steps.quarantine.outputs.quarantined == 'true' }}
        env:
          FILTER: ${{ matrix.filter }}
        run: node scripts/examples-suite.mjs --mode capture --filter "$FILTER" --no-build

      # --- events.json structural diff ---
      - name: Events structural diff
        if: always() && steps.capture.outcome == 'success'
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          BASELINE="baselines/events/${SLUG}.json"
          CURRENT="output/example-suite/${SLUG}/events.json"

          if [ ! -f "$BASELINE" ]; then
            echo "No events baseline for ${SLUG} — skipping diff."
            echo "### Events Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
            echo "No baseline found. Run \`node scripts/update-baselines.mjs --type events\` to create one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$CURRENT" ]; then
            echo "No current events.json for ${SLUG} — skipping diff."
            exit 0
          fi

          RESULT=$(node scripts/events-diff.mjs --baseline "$BASELINE" --current "$CURRENT" 2>&1) || true
          echo "### Events Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Re-run to get exit code for the step
          node scripts/events-diff.mjs --baseline "$BASELINE" --current "$CURRENT"

      # --- Visual regression diff ---
      - name: Visual regression diff
        if: always() && steps.capture.outcome == 'success'
        continue-on-error: true
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          MP4="output/example-suite/${SLUG}/output.mp4"

          if [ ! -f "$MP4" ]; then
            echo "No output.mp4 for ${SLUG} — skipping visual diff."
            exit 0
          fi

          BASELINE_DIR="baselines/golden-frames/${SLUG}"
          if [ ! -d "$BASELINE_DIR" ]; then
            echo "No golden-frame baseline for ${SLUG} — skipping visual diff."
            echo "### Visual Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
            echo "No baseline found. Run \`node scripts/visual-diff-gate.mjs --update-baselines\` to create one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RESULT=$(node scripts/visual-diff-gate.mjs --filter "$SLUG" --threshold 2 2>&1) || true
          echo "### Visual Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Re-run to get exit code — warn but do not fail the job
          node scripts/visual-diff-gate.mjs --filter "$SLUG" --threshold 2 || {
            echo "::warning::Visual regression detected for ${SLUG}"
          }

      - name: Upload visual diff report
        if: always() && steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ matrix.slug }}
          path: output/visual-diff-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.slug }}
          path: output/example-suite/*/trace.zip
          retention-days: 7
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────
  # Job 4 — Capture all specs (nightly + push to master, sharded)
  # ──────────────────────────────────────────────────────────────────
  nightly-matrix:
    name: Nightly Capture Matrix
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix
        id: gen
        run: |
          MATRIX=$(node scripts/ci-matrix.mjs --tier nightly)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  capture-nightly:
    name: "Capture: ${{ matrix.slug }}"
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [lint-and-test, nightly-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.nightly-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      # Cache Playwright browsers
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e 'console.log(require("./node_modules/playwright/package.json").version)')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-ubuntu

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # --- Flake quarantine check ---
      - name: Check quarantine status
        id: quarantine
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          node scripts/flake-quarantine.mjs --check "$SLUG" && echo "quarantined=false" >> "$GITHUB_OUTPUT" || {
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 78 ]; then
              echo "::warning::${SLUG} is quarantined — failures will be treated as warnings"
              echo "quarantined=true" >> "$GITHUB_OUTPUT"
            else
              echo "quarantined=false" >> "$GITHUB_OUTPUT"
              exit "$EXIT_CODE"
            fi
          }

      # --- Nightly: quarantined specs run 3 times to detect healing ---
      - name: "Capture (quarantine retry 1/3)"
        id: capture-q1
        if: steps.quarantine.outputs.quarantined == 'true'
        continue-on-error: true
        env:
          FILTER: ${{ matrix.filter }}
        run: node scripts/examples-suite.mjs --mode capture --filter "$FILTER" --no-build

      - name: "Capture (quarantine retry 2/3)"
        id: capture-q2
        if: steps.quarantine.outputs.quarantined == 'true'
        continue-on-error: true
        env:
          FILTER: ${{ matrix.filter }}
        run: node scripts/examples-suite.mjs --mode capture --filter "$FILTER" --no-build

      - name: "Capture (quarantine retry 3/3)"
        id: capture-q3
        if: steps.quarantine.outputs.quarantined == 'true'
        continue-on-error: true
        env:
          FILTER: ${{ matrix.filter }}
        run: node scripts/examples-suite.mjs --mode capture --filter "$FILTER" --no-build

      - name: Quarantine healing check
        if: steps.quarantine.outputs.quarantined == 'true'
        env:
          SLUG: ${{ matrix.slug }}
          Q1_OUTCOME: ${{ steps.capture-q1.outcome }}
          Q2_OUTCOME: ${{ steps.capture-q2.outcome }}
          Q3_OUTCOME: ${{ steps.capture-q3.outcome }}
        run: |
          if [ "$Q1_OUTCOME" = "success" ] && \
             [ "$Q2_OUTCOME" = "success" ] && \
             [ "$Q3_OUTCOME" = "success" ]; then
            echo "::notice::${SLUG} passed all 3 quarantine runs — consider removing from flake-registry.json"
            echo "### Quarantine Healing: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
            echo "${SLUG} passed **all 3 retries**. Consider removing from \`flake-registry.json\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::${SLUG} is quarantined and still flaky (results: ${Q1_OUTCOME}, ${Q2_OUTCOME}, ${Q3_OUTCOME})"
          fi

      - name: Capture
        id: capture
        if: steps.quarantine.outputs.quarantined != 'true'
        continue-on-error: false
        env:
          FILTER: ${{ matrix.filter }}
        run: node scripts/examples-suite.mjs --mode capture --filter "$FILTER" --no-build

      # --- events.json structural diff ---
      # Nightly: report-only, structural diffs are advisory
      - name: Events structural diff
        if: always() && (steps.capture.outcome == 'success' || steps.capture-q3.outcome == 'success')
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          BASELINE="baselines/events/${SLUG}.json"
          CURRENT="output/example-suite/${SLUG}/events.json"

          if [ ! -f "$BASELINE" ]; then
            echo "No events baseline for ${SLUG} — skipping diff."
            echo "### Events Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
            echo "No baseline found. Run \`node scripts/update-baselines.mjs --type events\` to create one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$CURRENT" ]; then
            echo "No current events.json for ${SLUG} — skipping diff."
            exit 0
          fi

          RESULT=$(node scripts/events-diff.mjs --baseline "$BASELINE" --current "$CURRENT" 2>&1) || true
          echo "### Events Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # --- Capture duration performance gate ---
      - name: Capture performance gate
        if: always() && (steps.capture.outcome == 'success' || steps.capture-q3.outcome == 'success')
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          BASELINE="baselines/perf/${SLUG}.json"
          CURRENT="output/example-suite/${SLUG}/metadata.json"

          if [ ! -f "$BASELINE" ]; then
            echo "No perf baseline for ${SLUG} — skipping gate."
            echo "### Perf Gate: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
            echo "No baseline found. Run \`node scripts/update-baselines.mjs --type perf\` to create one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$CURRENT" ]; then
            echo "No current metadata.json for ${SLUG} — skipping gate."
            exit 0
          fi

          RESULT=$(node scripts/capture-perf-gate.mjs --baseline "$BASELINE" --current "$CURRENT" 2>&1) || true
          echo "### Perf Gate: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Re-run to get exit code — warn but do not fail the job
          node scripts/capture-perf-gate.mjs --baseline "$BASELINE" --current "$CURRENT" || {
            echo "::warning::Performance regression detected for ${SLUG}"
          }

      # --- Visual regression diff ---
      - name: Visual regression diff
        if: always() && (steps.capture.outcome == 'success' || steps.capture-q3.outcome == 'success')
        continue-on-error: true
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          MP4="output/example-suite/${SLUG}/output.mp4"

          if [ ! -f "$MP4" ]; then
            echo "No output.mp4 for ${SLUG} — skipping visual diff."
            exit 0
          fi

          BASELINE_DIR="baselines/golden-frames/${SLUG}"
          if [ ! -d "$BASELINE_DIR" ]; then
            echo "No golden-frame baseline for ${SLUG} — skipping visual diff."
            echo "### Visual Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
            echo "No baseline found. Run \`node scripts/visual-diff-gate.mjs --update-baselines\` to create one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RESULT=$(node scripts/visual-diff-gate.mjs --filter "$SLUG" --threshold 2 2>&1) || true
          echo "### Visual Diff: ${SLUG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Nightly: report-only, visual diffs are advisory
          node scripts/visual-diff-gate.mjs --filter "$SLUG" --threshold 2 || {
            echo "::warning::Visual regression detected for ${SLUG}"
          }

      - name: Upload visual diff report
        if: always() && (steps.capture.outcome == 'success' || steps.capture-q3.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-nightly-${{ matrix.slug }}
          path: output/visual-diff-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.slug }}
          path: output/example-suite/*/trace.zip
          retention-days: 7
          if-no-files-found: ignore
