      *,
      *::before,

      body {
        background: #0d0f14;
        color: #e2e8f0;
        font-family:

          -apple-system,
          sans-serif;
        min-height: 100vh;
        padding: 24px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .header h1 {
        font-size: 20px;
        font-weight: 700;
        color: #f1f5f9;
        letter-spacing: -0.02em;
      }

      .header-meta {
        font-size: 11px;
        color: #475569;
      }

      /* Summary bar */
      .summary {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .summary-card {
        background: #141720;
        border: 1px solid #1e2330;
        border-radius: 8px;
        padding: 14px 20px;
        min-width: 130px;
        flex: 1;
      }

      .summary-card .label {
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 4px;
      }

      .summary-card .value {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .summary-card .value.total {
        color: #e2e8f0;
      }
      .summary-card .value.pass {
        color: #4ade80;
      }
      .summary-card .value.fail {
        color: #f87171;
      }
      .summary-card .value.warn {
        color: #facc15;
      }
      .summary-card .value.missing {
        color: #64748b;
      }

      /* Controls */
      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .search-box {
        background: #141720;
        border: 1px solid #2d3448;
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 13px;
        padding: 7px 12px;
        width: 260px;
        outline: none;
        transition: border-color 0.15s;
      }

      .search-box:focus {
        border-color: #2563eb;
      }

      .search-box::placeholder {
        color: #475569;
      }

      .filter-btn {
        background: #1e2330;
        border: 1px solid #2d3448;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        transition:
          background 0.12s,
          color 0.12s,
          border-color 0.12s;
      }

      .filter-btn:hover,
      .filter-btn.active {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }

      /* Table */
      .table-wrap {
        overflow-x: auto;
        border-radius: 8px;
        border: 1px solid #1e2330;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead th {
        background: #141720;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 14px;
        text-align: left;
        border-bottom: 1px solid #1e2330;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        position: relative;
      }

      thead th:hover {
        color: #e2e8f0;
      }

      thead th .sort-arrow {
        margin-left: 4px;
        font-size: 10px;
        color: #475569;
      }

      thead th.sorted .sort-arrow {
        color: #2563eb;
      }

      tbody tr {
        border-bottom: 1px solid #1a1e2a;
        transition: background 0.1s;
      }

      tbody tr:hover {
        background: #141720;
      }

      tbody td {
        padding: 10px 14px;
        white-space: nowrap;
      }

      /* Status badge */
      .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .badge-pass {
        background: #14532d;
        color: #4ade80;
      }
      .badge-fail {
        background: #450a0a;
        color: #f87171;
      }
      .badge-warn {
        background: #422006;
        color: #facc15;
      }
      .badge-missing {
        background: #1e293b;
        color: #64748b;
      }

      /* Sparkline bar */
      .bar-cell {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .bar-track {
        width: 80px;
        height: 6px;
        background: #1e2330;
        border-radius: 3px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.3s;
      }

      .bar-fill.duration {
        background: #3b82f6;
      }
      .bar-fill.size {
        background: #8b5cf6;
      }

      .bar-value {
        font-size: 12px;
        color: #94a3b8;
        min-width: 50px;
      }

      /* Action type pills */
      .action-pills {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
      }

      .action-pill {
        font-size: 9px;
        font-weight: 600;
        padding: 1px 5px;
        border-radius: 3px;
        background: #1e2330;
        color: #64748b;
      }

      /* Narration coverage mini-bar */
      .coverage-cell {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .coverage-track {
        width: 50px;
        height: 6px;
        background: #1e2330;
        border-radius: 3px;
        overflow: hidden;
      }

      .coverage-fill {
        height: 100%;
        border-radius: 3px;
        background: #22c55e;
      }

      .coverage-value {
        font-size: 12px;
        color: #94a3b8;
      }

      .muted {
        color: #475569;
      }

      .quality-score {
        font-weight: 600;
      }
      .quality-score.perfect {
        color: #4ade80;
      }
      .quality-score.good {
        color: #facc15;
      }
      .quality-score.bad {
        color: #f87171;
      }

      .timestamp {
        font-size: 11px;
        color: #64748b;
      }
    </style>

        {

          title: "GridV - Virtualized Table Demo",
          status: "pass",

          specPath: "C:\\Projects\\demo-machine\\examples\\virtual-table.demo.yaml",
          qualityScore: 100,

          eventCount: 5,
        },
      ];
      const maxDuration = 26.91;
      const maxSize = 2.86;

      let currentFilter = "all";
      let currentSearch = "";
      let sortCol = "slug";
      let sortAsc = true;

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function statusBadge(s) {
        return '<span class="badge badge-' + s + '">' + s + "</span>";
      }

      function barHtml(value, max, cls) {
        if (value == null) return '<span class="muted">--</span>';
        const pct = Math.min(100, (value / max) * 100).toFixed(1);
        return (
          '<div class="bar-cell">' +
          '<div class="bar-track"><div class="bar-fill ' +
          cls +
          '" style="width:' +
          pct +
          '%"></div></div>' +
          '<span class="bar-value">' +
          value +
          (cls === "duration" ? "s" : " MB") +
          "</span>" +
          "</div>"
        );
      }

      function actionPillsHtml(types) {
        if (!types || Object.keys(types).length === 0) return '<span class="muted">--</span>';
        return (
          '<div class="action-pills">' +
          Object.entries(types)
            .sort((a, b) => b[1] - a[1])
            .map(function (e) {
              return '<span class="action-pill">' + escapeHtml(e[0]) + ":" + e[1] + "</span>";
            })
            .join("") +
          "</div>"
        );
      }

      function coverageHtml(pct) {
        if (pct == null) return '<span class="muted">--</span>';
        return (
          '<div class="coverage-cell">' +
          '<div class="coverage-track"><div class="coverage-fill" style="width:' +
          Math.min(100, pct) +
          '%"></div></div>' +
          '<span class="coverage-value">' +
          pct +
          "%</span>" +
          "</div>"
        );
      }

      function qualityHtml(score) {
        if (score == null) return '<span class="muted">--</span>';
        var cls = score >= 100 ? "perfect" : score >= 70 ? "good" : "bad";
        return '<span class="quality-score ' + cls + '">' + score + "%</span>";
      }

      function timestampHtml(ts) {
        if (!ts) return '<span class="muted">--</span>';
        try {
          var d = new Date(ts);
          return '<span class="timestamp">' + d.toLocaleString() + "</span>";
        } catch (e) {
          return '<span class="timestamp">' + escapeHtml(ts) + "</span>";
        }
      }

      function sortValue(demo, col) {
        switch (col) {
          case "slug":
            return demo.slug.toLowerCase();
          case "status":
            return ["pass", "warn", "fail", "missing"].indexOf(demo.status);
          case "durationSec":
            return demo.durationSec ?? -1;
          case "actionCount":
            return demo.actionCount ?? -1;
          case "narrationCoverage":
            return demo.narrationCoverage ?? -1;
          case "videoSizeMb":
            return demo.videoSizeMb ?? -1;
          case "qualityScore":
            return demo.qualityScore ?? -1;
          case "lastCaptureTimestamp":
            return demo.lastCaptureTimestamp ?? "";
          default:
            return "";
        }
      }

      function render() {
        var filtered = demos.filter(function (d) {
          if (currentFilter !== "all" && d.status !== currentFilter) return false;
          if (
            currentSearch &&
            d.slug.toLowerCase().indexOf(currentSearch) === -1 &&
            (d.title || "").toLowerCase().indexOf(currentSearch) === -1
          )
            return false;
          return true;
        });

        filtered.sort(function (a, b) {
          var va = sortValue(a, sortCol);
          var vb = sortValue(b, sortCol);
          if (va < vb) return sortAsc ? -1 : 1;
          if (va > vb) return sortAsc ? 1 : -1;
          return 0;
        });

        var html = "";
        for (var i = 0; i < filtered.length; i++) {
          var d = filtered[i];
          html +=
            "<tr>" +
            "<td><strong>" +
            escapeHtml(d.slug) +
            "</strong></td>" +
            "<td>" +
            statusBadge(d.status) +
            "</td>" +
            "<td>" +
            barHtml(d.durationSec, maxDuration, "duration") +
            "</td>" +
            "<td>" +
            (d.actionCount || '<span class="muted">--</span>') +
            "</td>" +
            "<td>" +
            actionPillsHtml(d.actionTypes) +
            "</td>" +
            "<td>" +
            coverageHtml(d.narrationCoverage) +
            "</td>" +
            "<td>" +
            barHtml(d.videoSizeMb, maxSize, "size") +
            "</td>" +
            "<td>" +
            qualityHtml(d.qualityScore) +
            "</td>" +
            "<td>" +
            timestampHtml(d.lastCaptureTimestamp) +
            "</td>" +
            "</tr>";
        }

        document.getElementById("tableBody").innerHTML = html;

        // Update sort arrows
        document.querySelectorAll("thead th").forEach(function (th) {
          var arrow = th.querySelector(".sort-arrow");
          if (!arrow) return;
          th.classList.remove("sorted");
          arrow.textContent = "";
          if (th.dataset.col === sortCol) {
            th.classList.add("sorted");
            arrow.textContent = sortAsc ? " \u25B2" : " \u25BC";
          }
        });
      }

      // Sort on header click
      document.querySelectorAll("thead th[data-col]").forEach(function (th) {
        th.addEventListener("click", function () {
          var col = th.dataset.col;
          if (col === "actionTypes") return; // not sortable
          if (sortCol === col) {
            sortAsc = !sortAsc;
          } else {
            sortCol = col;
            sortAsc = true;
          }
          render();
        });
      });

      // Filter buttons
      document.querySelectorAll(".filter-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".filter-btn").forEach(function (b) {
            b.classList.remove("active");
          });
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          render();
        });
      });

      // Search
      document.getElementById("searchBox").addEventListener("input", function (e) {
        currentSearch = e.target.value.toLowerCase().trim();
        render();
      });

      render();
    </script>
