meta:
  title: "Proof: Wait for Page Function"

runner:
  command: "node examples/async-skeleton/serve.mjs"
  url: "http://localhost:4583"
  timeout: 10000

chapters:
  - title: "Wait for Browser Condition"
    steps:
      - action: navigate
        url: "/"
      - action: waitForPageFunction
        expression: 'document.querySelector(''[data-testid="metric-revenue"]'')?.offsetParent !== null'
        label: "revenue-metric-visible"
        timeoutMs: 5000
        pollingMs: 100
      - action: screenshot
        name: "wait-for-page-function-proof"
