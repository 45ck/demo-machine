meta:
  title: "Proof: Wait for Page Function"

runner:
  url: "https://example.com"

chapters:
  - title: "Wait for Browser Condition"
    steps:
      - action: navigate
        url: "https://example.com"
      - action: waitForPageFunction
        expression: "document.readyState === 'complete'"
        label: "document-ready"
        timeoutMs: 2000
        pollingMs: 100
      - action: screenshot
        name: "wait-for-page-function-proof"
