meta:
  title: "Proof: Scroll Action"
  resolution:
    width: 1280
    height: 720

runner:
  command: "node examples/infinite-scroll/serve.mjs"
  url: "http://localhost:4571"
  timeout: 10000

pacing:
  cursorDurationMs: 600

chapters:
  - title: "Scroll Actions"
    steps:
      - action: navigate
        url: "/"
        narration: "Testing the scroll action on the ScrollForge infinite-scroll app."

      - action: assert
        selector: "[data-testid='count']"
        text: "items: 20"
        narration: "The list starts with 20 items loaded."

      - action: scroll
        selector: "[data-testid='list']"
        y: 800
        narration: "Scroll down to trigger loading more items."

      - action: wait
        timeout: 800

      - action: scroll
        selector: "[data-testid='list']"
        y: 800
        narration: "Scroll again to trigger the next page load."

      - action: wait
        timeout: 800

      - action: assert
        selector: "[data-testid='count']"
        text: "items: 40"
        narration: "After two scrolls, 40 items are now loaded."
